name: auto-fix

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  KIMI_MODEL_NAME: ${{ vars.LLM_MODEL || 'kimi-for-coding' }}
  KIMI_MODEL_API_KEY: ${{ secrets.LLM_API_KEY }}
  KIMI_MODEL_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.kimi.com/coding/v1' }}
  KIMI_CODE_TRUST_WORKSPACE: '1'
  KIMI_CODE_NO_AUTO_UPDATE: '1'
  KIMI_DISABLE_TELEMETRY: '1'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  fix:
    if: >-
      github.event.review.state == 'changes_requested' &&
      startsWith(github.event.pull_request.head.ref, 'auto/') &&
      github.event.review.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: 检查自动修复轮数
        id: rounds
        run: |
          count=$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.author.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED")] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 3 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "已完成 3 轮自动修复，仍有评审意见未解决，请人工介入。"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 安装 Kimi Code CLI
        if: steps.rounds.outputs.allowed == 'true'
        uses: ./.github/actions/setup-kimi
        with:
          version: ${{ vars.KIMI_CLI_VERSION || 'latest' }}
      - name: 准备修复分支
        if: steps.rounds.outputs.allowed == 'true'
        run: |
          git config user.name "auto-dev-bot"
          git config user.email "auto-dev-bot@users.noreply.github.com"
          git fetch origin
          git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
      - name: 使用 Kimi Code 修复评审问题
        if: steps.rounds.outputs.allowed == 'true'
        run: kimi -p "$(cat .github/prompts/fix.md)"
      - name: 检测文件变更
        id: changes
        if: steps.rounds.outputs.allowed == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_NUMBER" --body "修复流程已执行，但没有检测到文件变更，请人工确认评审意见。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 阻止修改受保护目录
        if: steps.changes.outputs.changed == 'true'
        run: |
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "Agent attempted to modify protected .github/ paths. Changes will not be committed."
            git diff --cached --name-only
            exit 1
          fi
      - name: 提交并推送修复
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "auto: fix review comments for PR #${PR_NUMBER}"
          git push origin "$BRANCH_NAME"
          if [ ! -s /tmp/auto-dev-fix-summary.md ]; then
            echo "Kimi Code 已按评审意见完成修复，详细过程请查看 Actions 日志。" > /tmp/auto-dev-fix-summary.md
          fi
          gh pr comment "$PR_NUMBER" --body-file /tmp/auto-dev-fix-summary.md
